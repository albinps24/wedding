<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 130" fill="none">
  <defs>
    <!-- ============ Gradients for depth ============ -->
    <radialGradient id="roseCore" cx="42%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#ffd9e6"/>
      <stop offset="45%" stop-color="#f58bb0"/>
      <stop offset="100%" stop-color="#d6537f"/>
    </radialGradient>
    <radialGradient id="roseCoreDeep" cx="42%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#ffc2d8"/>
      <stop offset="50%" stop-color="#e86a97"/>
      <stop offset="100%" stop-color="#b83e6c"/>
    </radialGradient>
    <radialGradient id="whiteBloom" cx="42%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#fbf4ee"/>
      <stop offset="100%" stop-color="#efe0d2"/>
    </radialGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7cbf6a"/>
      <stop offset="55%" stop-color="#4f9d47"/>
      <stop offset="100%" stop-color="#2f7a3a"/>
    </linearGradient>
    <linearGradient id="leafGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5aa34d"/>
      <stop offset="100%" stop-color="#245f2c"/>
    </linearGradient>

    <!-- ============ Realistic pointed leaf (with midrib) ============ -->
    <g id="leaf">
      <path d="M0 0 C 6 -4 14 -3 20 4 C 14 8 6 8 0 4 C -1 2 -1 2 0 0 Z" fill="url(#leafGrad)"/>
      <path d="M1 2 C 7 1 13 2 18 4" stroke="#2f7a3a" stroke-width="0.5" fill="none" opacity="0.6"/>
    </g>
    <g id="leafDark">
      <path d="M0 0 C 5 -3.5 12 -2.5 17 3.5 C 12 7 5 7 0 3.5 C -1 2 -1 1.5 0 0 Z" fill="url(#leafGradDark)"/>
      <path d="M1 1.8 C 6 1 11 1.8 15 3.5" stroke="#1f5426" stroke-width="0.5" fill="none" opacity="0.6"/>
    </g>

    <!-- ============ Layered rose (real petals) ============ -->
    <g id="rose">
      <!-- outer petals -->
      <g fill="url(#roseCore)">
        <path d="M0 -9 C 6 -9 9 -4 8 1 C 4 2 1 0 0 -3 C -1 0 -4 2 -8 1 C -9 -4 -6 -9 0 -9 Z"/>
        <path d="M9 -1 C 11 4 8 9 3 9 C 1 5 2 1 5 -1 C 7 -2 8 -2 9 -1 Z"/>
        <path d="M-9 -1 C -11 4 -8 9 -3 9 C -1 5 -2 1 -5 -1 C -7 -2 -8 -2 -9 -1 Z"/>
        <path d="M-4 8 C 0 11 4 11 4 8 C 3 5 0 4 -1 5 C -3 6 -3 7 -4 8 Z"/>
      </g>
      <!-- inner swirl petals -->
      <g fill="url(#roseCoreDeep)">
        <path d="M0 -5 C 4 -5 5 -1 3 2 C 0 3 -2 1 -2 -2 C -2 -4 -1 -5 0 -5 Z"/>
        <path d="M4 0 C 6 3 3 6 0 5 C -1 2 1 -1 3 -1 C 4 -1 4 0 4 0 Z"/>
        <path d="M-3 3 C -1 5 2 4 2 2 C 1 0 -1 0 -2 1 C -3 2 -3 2 -3 3 Z"/>
      </g>
      <circle r="1.6" fill="#a83060"/>
    </g>

    <!-- ============ White five-petal bloom ============ -->
    <g id="whiteFlower">
      <g fill="url(#whiteBloom)" stroke="#e6d4c4" stroke-width="0.3">
        <ellipse cx="0" cy="-5" rx="2.6" ry="4.2"/>
        <ellipse cx="4.8" cy="-1.5" rx="2.6" ry="4.2" transform="rotate(72 4.8 -1.5)"/>
        <ellipse cx="3" cy="4.3" rx="2.6" ry="4.2" transform="rotate(144 3 4.3)"/>
        <ellipse cx="-3" cy="4.3" rx="2.6" ry="4.2" transform="rotate(216 -3 4.3)"/>
        <ellipse cx="-4.8" cy="-1.5" rx="2.6" ry="4.2" transform="rotate(288 -4.8 -1.5)"/>
      </g>
      <circle r="2" fill="#f2c94c"/>
      <circle r="1" fill="#e0a92e"/>
    </g>

    <!-- ============ Bud ============ -->
    <g id="bud">
      <path d="M0 -6 C 3 -6 4 -1 3 3 C 1 5 -1 5 -3 3 C -4 -1 -3 -6 0 -6 Z" fill="url(#roseCoreDeep)"/>
      <path d="M-3 3 C -2 6 2 6 3 3 C 2 5 -2 5 -3 3 Z" fill="#3f8a3d"/>
    </g>

    <!-- ============ Hanging vine with alternating leaves ============ -->
    <g id="vineShort">
      <path d="M0 0 C 3 12 -3 24 1 36" stroke="#3f8a3d" stroke-width="1.4" fill="none"/>
      <use href="#leaf" transform="translate(1 8) rotate(120) scale(0.8)"/>
      <use href="#leafDark" transform="translate(-1 16) rotate(60) scale(0.8)"/>
      <use href="#leaf" transform="translate(1 26) rotate(115) scale(0.75)"/>
    </g>
  </defs>

  <style>
    .vine-left, .vine-right, .vine-center {
      transform-box: fill-box;
      transform-origin: center top;
    }
    @keyframes swayA { 0%{transform:rotate(-1.8deg)} 50%{transform:rotate(1.8deg)} 100%{transform:rotate(-1.8deg)} }
    @keyframes swayB { 0%{transform:rotate(1.5deg)} 50%{transform:rotate(-1.5deg)} 100%{transform:rotate(1.5deg)} }
    @keyframes swayC { 0%{transform:rotate(-2.4deg)} 50%{transform:rotate(2.4deg)} 100%{transform:rotate(-2.4deg)} }
    .vine-left   { animation: swayA 4.2s ease-in-out infinite; }
    .vine-right  { animation: swayB 4.8s ease-in-out infinite; }
    .vine-center { animation: swayC 5.6s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .vine-left, .vine-right, .vine-center { animation: none; }
    }
  </style>

  <!-- ============ Top greenery rail (layered leaves) ============ -->
  <g>
    <use href="#leafDark" transform="translate(8 14) rotate(200) scale(1.1)"/>
    <use href="#leaf" transform="translate(20 10) rotate(-30) scale(1.1)"/>
    <use href="#leafDark" transform="translate(34 15) rotate(210) scale(1)"/>
    <use href="#leaf" transform="translate(48 9) rotate(-25) scale(1.15)"/>
    <use href="#leaf" transform="translate(64 13) rotate(-40) scale(1)"/>
    <use href="#leafDark" transform="translate(80 10) rotate(195) scale(1.1)"/>
    <use href="#leaf" transform="translate(96 14) rotate(-30) scale(1.1)"/>
    <use href="#leafDark" transform="translate(112 9) rotate(205) scale(1)"/>
    <use href="#leaf" transform="translate(128 13) rotate(-35) scale(1.15)"/>
    <use href="#leaf" transform="translate(146 10) rotate(-28) scale(1.05)"/>
    <use href="#leafDark" transform="translate(162 14) rotate(200) scale(1.1)"/>
    <use href="#leaf" transform="translate(180 9) rotate(-32) scale(1.15)"/>
    <use href="#leafDark" transform="translate(198 13) rotate(210) scale(1.05)"/>
    <use href="#leaf" transform="translate(216 10) rotate(-30) scale(1.1)"/>
    <use href="#leaf" transform="translate(234 14) rotate(-38) scale(1)"/>
    <use href="#leafDark" transform="translate(252 9) rotate(200) scale(1.1)"/>
    <use href="#leaf" transform="translate(270 13) rotate(-30) scale(1.15)"/>
    <use href="#leafDark" transform="translate(288 10) rotate(205) scale(1.05)"/>
    <use href="#leaf" transform="translate(306 14) rotate(-34) scale(1.1)"/>
    <use href="#leaf" transform="translate(324 9) rotate(-28) scale(1)"/>
    <use href="#leafDark" transform="translate(342 13) rotate(200) scale(1.1)"/>
    <use href="#leaf" transform="translate(360 10) rotate(-32) scale(1.15)"/>
    <use href="#leafDark" transform="translate(378 14) rotate(210) scale(1.05)"/>
    <use href="#leaf" transform="translate(392 10) rotate(-30) scale(1.05)"/>
  </g>

  <!-- ============ Hanging vines + roses ============ -->
  <g transform="translate(22 16)"><g class="vine-left"><use href="#vineShort"/><use href="#rose" transform="translate(1 40) scale(0.85)"/></g></g>
  <g transform="translate(52 13)"><g class="vine-right" style="animation-delay:.3s"><use href="#vineShort"/><use href="#whiteFlower" transform="translate(1 40) scale(0.95)"/></g></g>
  <g transform="translate(82 18)"><g class="vine-left" style="animation-delay:.6s"><path d="M0 0 C 2 10 -2 20 1 30" stroke="#3f8a3d" stroke-width="1.3" fill="none"/><use href="#leaf" transform="translate(1 9) rotate(120) scale(0.7)"/><use href="#leafDark" transform="translate(-1 18) rotate(60) scale(0.7)"/><use href="#bud" transform="translate(0 32)"/></g></g>

  <g transform="translate(112 15)"><g class="vine-right" style="animation-delay:.2s"><use href="#vineShort"/><use href="#rose" transform="translate(1 40) scale(0.9)"/></g></g>
  <g transform="translate(142 20)"><g class="vine-left" style="animation-delay:.4s"><path d="M0 0 C 3 14 -3 28 1 42" stroke="#3f8a3d" stroke-width="1.4" fill="none"/><use href="#leaf" transform="translate(1 10) rotate(120) scale(0.8)"/><use href="#leafDark" transform="translate(-1 20) rotate(60) scale(0.8)"/><use href="#leaf" transform="translate(1 32) rotate(115) scale(0.75)"/><use href="#whiteFlower" transform="translate(1 46) scale(0.85)"/></g></g>

  <!-- CENTER (longer, focal roses) -->
  <g transform="translate(172 16)"><g class="vine-center"><path d="M0 0 C 4 22 -4 46 1 66" stroke="#3f8a3d" stroke-width="1.5" fill="none"/><use href="#leaf" transform="translate(1 14) rotate(120) scale(0.85)"/><use href="#leafDark" transform="translate(-2 30) rotate(60) scale(0.85)"/><use href="#leaf" transform="translate(1 46) rotate(115) scale(0.8)"/><use href="#rose" transform="translate(1 70) scale(1.05)"/></g></g>
  <g transform="translate(200 13)"><g class="vine-center" style="animation-delay:.5s"><path d="M0 0 C -3 26 4 54 1 82" stroke="#3f8a3d" stroke-width="1.5" fill="none"/><use href="#leafDark" transform="translate(2 16) rotate(60) scale(0.85)"/><use href="#leaf" transform="translate(-2 34) rotate(120) scale(0.85)"/><use href="#leafDark" transform="translate(2 52) rotate(60) scale(0.8)"/><use href="#whiteFlower" transform="translate(1 74) scale(1)"/><use href="#bud" transform="translate(1 88) scale(0.9)"/></g></g>
  <g transform="translate(228 16)"><g class="vine-center" style="animation-delay:1s"><path d="M0 0 C -4 22 4 46 1 66" stroke="#3f8a3d" stroke-width="1.5" fill="none"/><use href="#leaf" transform="translate(2 14) rotate(115) scale(0.85)"/><use href="#leafDark" transform="translate(-2 30) rotate(60) scale(0.85)"/><use href="#leaf" transform="translate(2 46) rotate(120) scale(0.8)"/><use href="#rose" transform="translate(1 70) scale(1.05)"/></g></g>

  <g transform="translate(262 20)"><g class="vine-left" style="animation-delay:.3s"><use href="#vineShort"/><use href="#rose" transform="translate(1 40) scale(0.85)"/></g></g>
  <g transform="translate(292 15)"><g class="vine-right" style="animation-delay:.6s"><path d="M0 0 C 2 12 -2 24 1 34" stroke="#3f8a3d" stroke-width="1.3" fill="none"/><use href="#leaf" transform="translate(1 10) rotate(120) scale(0.75)"/><use href="#leafDark" transform="translate(-1 20) rotate(60) scale(0.75)"/><use href="#whiteFlower" transform="translate(1 38) scale(0.9)"/></g></g>

  <g transform="translate(322 18)"><g class="vine-right"><use href="#vineShort"/><use href="#bud" transform="translate(1 40) scale(1.1)"/></g></g>
  <g transform="translate(352 13)"><g class="vine-left" style="animation-delay:.5s"><use href="#vineShort"/><use href="#rose" transform="translate(1 40) scale(0.85)"/></g></g>
  <g transform="translate(382 16)"><g class="vine-right" style="animation-delay:.8s"><path d="M0 0 C 2 10 -2 20 1 30" stroke="#3f8a3d" stroke-width="1.3" fill="none"/><use href="#leaf" transform="translate(1 9) rotate(120) scale(0.7)"/><use href="#leafDark" transform="translate(-1 18) rotate(60) scale(0.7)"/><use href="#whiteFlower" transform="translate(1 33) scale(0.85)"/></g></g>

  <!-- ============ Accent blooms pinned on the top rail ============ -->
  <use href="#rose" transform="translate(36 14) scale(0.7)"/>
  <use href="#whiteFlower" transform="translate(98 12) scale(0.8)"/>
  <use href="#rose" transform="translate(156 13) scale(0.65)"/>
  <use href="#whiteFlower" transform="translate(246 12) scale(0.8)"/>
  <use href="#rose" transform="translate(308 14) scale(0.7)"/>
  <use href="#whiteFlower" transform="translate(372 12) scale(0.75)"/>
</svg>
