<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" fill="none">
  <style>
    .line       { stroke: #3a3a3a; stroke-width: 1.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .line-thin  { stroke: #4a4a4a; stroke-width: 0.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .line-fine  { stroke: #5a5a5a; stroke-width: 0.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .fill-white { fill: #fafafa; }
    .fill-light { fill: #f2f2f2; }
    .fill-mid   { fill: #d8d8d8; }
    .fill-dark  { fill: #2a2a2a; }
    .fill-hair  { fill: #1e1e1e; }
    .tree       { fill: none; stroke: #4a4a4a; stroke-width: 1; }
    .hatch      { stroke: #b8b8b8; stroke-width: 0.6; fill: none; }
    .fill-cream-fade { fill: #f8f5ec; }
  </style>

  <defs>
    <linearGradient id="fadeG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8f5ec" stop-opacity="0"/>
      <stop offset="1" stop-color="#f8f5ec" stop-opacity="1"/>
    </linearGradient>
    <!-- small sketched daisy -->
    <g id="daisy">
      <g class="line-thin fill-white">
        <ellipse cx="0" cy="-3" rx="1" ry="2.4"/>
        <ellipse cx="2.8" cy="-0.9" rx="1" ry="2.4" transform="rotate(72 2.8 -0.9)"/>
        <ellipse cx="1.7" cy="2.5" rx="1" ry="2.4" transform="rotate(144 1.7 2.5)"/>
        <ellipse cx="-1.7" cy="2.5" rx="1" ry="2.4" transform="rotate(216 -1.7 2.5)"/>
        <ellipse cx="-2.8" cy="-0.9" rx="1" ry="2.4" transform="rotate(288 -2.8 -0.9)"/>
      </g>
      <circle r="1.1" class="fill-mid"/>
    </g>
  </defs>

  <!-- ===== COUPLE FROM BEHIND (black & white sketch) ===== -->
  <g transform="translate(200 246)">
    <!-- ground shadow (light hatch) -->
    <ellipse cx="2" cy="52" rx="56" ry="10" class="fill-light"/>

    <!-- ===== GROOM (left) ===== -->
    <g transform="translate(-20 0)">
      <!-- trousers -->
      <path class="line fill-light" d="M-11 30 C -13 55 -14 78 -12 96 L -3 96 C -3 74 -2 52 -1 32 Z"/>
      <path class="line fill-light" d="M1 32 C 2 52 3 74 3 96 L 12 96 C 14 78 13 55 11 30 Z"/>
      <!-- shoes -->
      <ellipse cx="-8" cy="98" rx="6" ry="3" class="fill-dark"/>
      <ellipse cx="8" cy="98" rx="6" ry="3" class="fill-dark"/>
      <!-- jacket -->
      <path class="line fill-white" d="M-16 -30 C -20 -6 -19 20 -15 34 C -5 38 9 38 17 34 C 21 18 20 -8 16 -30 C 8 -35 -8 -35 -16 -30 Z"/>
      <!-- jacket shading hatch -->
      <path class="hatch" d="M-11 -22 C -13 0 -12 20 -10 32"/>
      <path class="hatch" d="M-6 -24 C -8 -2 -7 18 -6 32"/>
      <path class="line-thin" d="M1 -32 L 1 35"/>
      <!-- collar -->
      <path class="line fill-light" d="M-8 -31 L -5 -22 L 1 -27 L 7 -22 L 10 -31 C 4 -34 -3 -34 -8 -31 Z"/>
      <!-- small cross pendant hint at the nape (Christian detail) -->
      <path class="line-thin" d="M1 -30 v 5 M-1.5 -28 h 5" stroke="#2a2a2a"/>
      <!-- neck with nape shading -->
      <path class="line fill-light" d="M-4 -38 h 9 v 8 h -9 Z"/>
      <path class="hatch" d="M-1 -37 v 6 M2 -37 v 6"/>
      <!-- head (back) -->
      <ellipse cx="0.5" cy="-46" rx="9.5" ry="10.5" class="line fill-light"/>
      <!-- ear hints -->
      <path class="line-thin" d="M-9 -46 c -2 0.5 -2 3 0 3"/>
      <path class="line-thin" d="M10 -46 c 2 0.5 2 3 0 3"/>
      <!-- hair: fuller crown, hairline, nape and strands -->
      <path class="fill-hair" d="M-10 -45 C -12 -60 13 -61 11 -45 C 11 -41 9 -39 6 -37 C 8 -40 8 -45 7 -49 C 3 -52 -3 -52 -6 -49 C -7 -45 -7 -40 -5 -37 C -8 -39 -10 -41 -10 -45 Z"/>
      <g class="line-thin" stroke="#111">
        <path d="M-6 -51 C -4 -48 -3 -43 -4 -39"/>
        <path d="M0 -53 C 0 -49 0 -44 -1 -40"/>
        <path d="M5 -51 C 6 -48 6 -43 4 -39"/>
      </g>
      <!-- arm around bride -->
      <path class="line" d="M15 -14 C 27 -6 34 2 36 10" stroke-width="8"/>
      <ellipse cx="37" cy="12" rx="4.4" ry="3.5" class="line fill-light"/>
    </g>

    <!-- ===== BRIDE (right) ===== -->
    <g transform="translate(16 0)">
      <!-- bridal veil flowing down the back (behind the gown) -->
      <path class="line-thin fill-white" d="M-6 -50 C -16 -30 -20 20 -14 66 C -6 40 -4 0 0 -34 C 4 0 6 40 14 66 C 20 20 16 -30 6 -50 C 3 -53 -3 -53 -6 -50 Z" opacity="0.85"/>
      <g class="hatch" opacity="0.8">
        <path d="M-10 -20 C -12 12 -12 40 -10 60"/>
        <path d="M0 -14 C 0 16 0 44 0 62"/>
        <path d="M10 -20 C 12 12 12 40 10 60"/>
      </g>
      <!-- flowing gown + train -->
      <path class="line fill-white" d="M-15 -6 C -20 20 -34 62 -46 104 C -20 112 30 112 52 104 C 34 60 20 18 15 -6 C 6 -10 -8 -10 -15 -6 Z"/>
      <!-- skirt fold hatching -->
      <path class="hatch" d="M-8 4 C -14 34 -24 68 -34 100"/>
      <path class="hatch" d="M2 6 C 0 38 -1 72 -3 102"/>
      <path class="hatch" d="M11 4 C 16 34 26 68 36 100"/>
      <path class="line-thin" d="M-46 104 C -20 110 30 110 52 104"/>
      <!-- lace bodice -->
      <path class="line fill-light" d="M-13 -30 C -15 -14 -14 -2 -12 6 C -4 9 8 9 14 6 C 16 -4 16 -16 13 -30 C 6 -33 -7 -33 -13 -30 Z"/>
      <!-- open back -->
      <path class="fill-white" d="M-7 -28 C -8 -14 -7 -4 -5 3 C -1 5 3 5 6 3 C 8 -4 8 -15 6 -28 C 2 -30 -3 -30 -7 -28 Z"/>
      <path class="line-thin" d="M-7 -28 C -8 -14 -7 -4 -5 3 M6 -28 C 8 -15 8 -4 6 3"/>
      <!-- lace straps -->
      <path class="line-thin" d="M-13 -30 C -14 -34 -11 -37 -8 -35"/>
      <path class="line-thin" d="M13 -30 C 14 -34 11 -37 8 -35"/>
      <!-- lace pattern -->
      <g class="line-thin">
        <path d="M-6 -22 q 6 4 12 0"/>
        <path d="M-6 -12 q 6 4 12 0"/>
        <path d="M-6 -2 q 6 4 12 0"/>
      </g>
      <!-- neck with nape shading -->
      <path class="line fill-light" d="M-3 -38 h 7 v 8 h -7 Z"/>
      <path class="hatch" d="M-1 -37 v 6 M2 -37 v 6"/>
      <!-- head (back) -->
      <ellipse cx="0.5" cy="-47" rx="8.5" ry="9.5" class="line fill-light"/>
      <!-- ear hints -->
      <path class="line-thin" d="M-8 -47 c -1.6 0.5 -1.6 2.6 0 2.6"/>
      <path class="line-thin" d="M9 -47 c 1.6 0.5 1.6 2.6 0 2.6"/>
      <!-- hair as a neat crown on the UPPER head only (leaves the head shape visible) -->
      <path class="fill-hair" d="M-8 -48 C -9 -58 10 -59 9 -48 C 6 -51 3 -52 0.5 -52 C -2 -52 -5 -51 -8 -48 Z"/>
      <!-- soft hairline sweeping down the sides -->
      <path class="line-thin" stroke="#111" d="M-8 -48 C -9 -44 -8 -41 -7 -39 M9 -48 C 10 -44 9 -41 8 -39"/>
      <g class="line-thin" stroke="#111">
        <path d="M-4 -52 C -3 -50 -3 -47 -4 -45"/>
        <path d="M0.5 -52 C 0.5 -50 0.5 -47 0 -45"/>
        <path d="M4 -52 C 5 -50 5 -47 4 -45"/>
      </g>
      <!-- low bun sitting at the nape (below the head) -->
      <ellipse cx="0.5" cy="-35" rx="4.6" ry="4" class="fill-hair"/>
      <path class="line-thin" stroke="#000" d="M-3 -35 C -1 -37 3 -37 4 -35 M-3 -34 C -1 -32 3 -32 4 -34"/>
      <!-- veil comb / tiara band at the crown -->
      <path class="line-thin" d="M-6 -53 C -2 -56 2 -56 6 -53"/>
      <!-- left arm -->
      <path class="line" d="M-13 -12 C -18 -2 -20 8 -19 16" stroke-width="4.5"/>
    </g>
  </g>

  <!-- Sketched daisies scattered on the meadow -->
  <use href="#daisy" transform="translate(80 296) scale(1.1)"/>
  <use href="#daisy" transform="translate(105 286) scale(0.9)"/>
  <use href="#daisy" transform="translate(128 300) scale(1)"/>
  <use href="#daisy" transform="translate(258 294) scale(0.9)"/>
  <use href="#daisy" transform="translate(288 302) scale(1.05)"/>
  <use href="#daisy" transform="translate(318 288) scale(0.9)"/>
  <use href="#daisy" transform="translate(345 300) scale(1)"/>
  <use href="#daisy" transform="translate(52 292) scale(0.95)"/>

  <!-- Cream fade at the base -->
  <rect x="0" y="255" width="400" height="65" fill="url(#fadeG)"/>
</svg>
