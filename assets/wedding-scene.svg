<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" fill="none">
  <defs>
    <!-- Ground tuned to the warm cream card palette so the scene blends into the card.
         Fades to the card cream (#f8f5ec) at the very bottom to hide the seam. -->
    <linearGradient id="grassG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dbe9c9"/>
      <stop offset="0.55" stop-color="#cfe0bd"/>
      <stop offset="1" stop-color="#f4efe2"/>
    </linearGradient>
    <linearGradient id="pathG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe6d3"/>
      <stop offset="1" stop-color="#e0cfa9"/>
    </linearGradient>
    <!-- Full-width cream wash that melts the base of the scene into the card -->
    <linearGradient id="fadeG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8f5ec" stop-opacity="0"/>
      <stop offset="1" stop-color="#f8f5ec" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="pillarG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d8d0c4"/>
      <stop offset="0.5" stop-color="#e8e2d8"/>
      <stop offset="1" stop-color="#c8c0b4"/>
    </linearGradient>
    <!-- leaf -->
    <g id="leaf">
      <ellipse rx="6" ry="2.5" fill="#5a9648"/>
    </g>
    <g id="leafD">
      <ellipse rx="5" ry="2" fill="#4a8638"/>
    </g>
    <!-- small white flower -->
    <g id="wfl">
      <circle r="4" fill="#ffffff"/>
      <circle r="1.5" fill="#8cc97a"/>
    </g>
    <!-- pink flower -->
    <g id="pfl">
      <circle r="5" fill="#f5b8c4"/>
      <circle r="2" fill="#eb9aaa"/>
    </g>
    <!-- ivy leaf -->
    <g id="ivy">
      <path d="M0 -4 C -4 -2 -5 2 -3 5 C 0 3 0 3 3 5 C 5 2 4 -2 0 -4 Z" fill="#6db35a"/>
    </g>
  </defs>

  <!-- Ground / grass area -->
  <ellipse cx="200" cy="310" rx="220" ry="50" fill="url(#grassG)" opacity="0.6"/>
  
  <!-- Stone path -->
  <path d="M160 320 L 240 320 L 218 220 L 182 220 Z" fill="url(#pathG)"/>
  <g stroke="#c4aa78" stroke-width="1" opacity="0.5">
    <path d="M180 235 L 220 235"/>
    <path d="M176 255 L 224 255"/>
    <path d="M172 278 L 228 278"/>
    <path d="M166 302 L 234 302"/>
  </g>

  <!-- Gate pillars -->
  <rect x="135" y="175" width="14" height="95" fill="url(#pillarG)" rx="2"/>
  <rect x="133" y="170" width="18" height="8" fill="#d0c8bc" rx="1"/>
  <rect x="251" y="175" width="14" height="95" fill="url(#pillarG)" rx="2"/>
  <rect x="249" y="170" width="18" height="8" fill="#d0c8bc" rx="1"/>
  
  <!-- Iron fence -->
  <g stroke="#3a3a3a" stroke-width="1.5" fill="none" opacity="0.7">
    <!-- Left fence -->
    <path d="M90 270 L 135 270"/>
    <path d="M90 240 L 135 240"/>
    <path d="M95 240 L 95 270"/><path d="M105 240 L 105 270"/><path d="M115 240 L 115 270"/><path d="M125 240 L 125 270"/>
    <!-- Right fence -->
    <path d="M265 270 L 310 270"/>
    <path d="M265 240 L 310 240"/>
    <path d="M275 240 L 275 270"/><path d="M285 240 L 285 270"/><path d="M295 240 L 295 270"/><path d="M305 240 L 305 270"/>
    <!-- Gate bars -->
    <path d="M155 180 L 155 270"/>
    <path d="M165 180 L 165 270"/>
    <path d="M175 180 L 175 270"/>
    <path d="M225 180 L 225 270"/>
    <path d="M235 180 L 235 270"/>
    <path d="M245 180 L 245 270"/>
    <!-- Gate horizontals -->
    <path d="M149 200 L 180 200"/>
    <path d="M149 250 L 180 250"/>
    <path d="M220 200 L 251 200"/>
    <path d="M220 250 L 251 250"/>
  </g>

  <!-- Ivy on fence/pillars -->
  <use href="#ivy" transform="translate(92 265) scale(0.8)"/>
  <use href="#ivy" transform="translate(100 258) scale(0.7)"/>
  <use href="#ivy" transform="translate(118 262) scale(0.85)"/>
  <use href="#ivy" transform="translate(130 255) scale(0.75)"/>
  <use href="#ivy" transform="translate(280 265) scale(0.8)"/>
  <use href="#ivy" transform="translate(295 260) scale(0.7)"/>
  <use href="#ivy" transform="translate(305 268) scale(0.8)"/>
  <use href="#ivy" transform="translate(270 258) scale(0.75)"/>
  
  <!-- Flowers at base of pillars -->
  <use href="#wfl" transform="translate(140 268) scale(0.9)"/>
  <use href="#pfl" transform="translate(148 272) scale(0.7)"/>
  <use href="#leaf" transform="translate(144 275) rotate(30)"/>
  <use href="#wfl" transform="translate(260 268) scale(0.9)"/>
  <use href="#pfl" transform="translate(252 272) scale(0.7)"/>
  <use href="#leaf" transform="translate(256 275) rotate(-30)"/>

  <!-- ===== COUPLE FROM BEHIND ===== -->
  <g transform="translate(200 245)">
    <!-- Groom (left) -->
    <g transform="translate(-18 0)">
      <!-- Hair -->
      <ellipse cx="0" cy="-62" rx="10" ry="9" fill="#8B6914"/>
      <!-- Head -->
      <ellipse cx="0" cy="-55" rx="9" ry="10" fill="#E8C8AE"/>
      <!-- Neck -->
      <rect x="-4" y="-46" width="8" height="6" fill="#E8C8AE"/>
      <!-- Suit jacket -->
      <path d="M-16 -40 C -18 -20 -18 25 -14 45 L 14 45 C 18 25 18 -20 16 -40 C 10 -42 -10 -42 -16 -40 Z" fill="#2C3E50"/>
      <!-- Suit back seam -->
      <path d="M0 -38 L 0 42" stroke="#1a2530" stroke-width="1" opacity="0.4"/>
      <!-- Collar -->
      <path d="M-8 -40 L -6 -32 L 0 -36 L 6 -32 L 8 -40" fill="#1a2530"/>
      <!-- Arm (around bride) -->
      <path d="M14 -30 C 28 -15 35 5 32 15" stroke="#2C3E50" stroke-width="10" fill="none" stroke-linecap="round"/>
      <!-- Hand on bride's back -->
      <ellipse cx="32" cy="18" rx="5" ry="4" fill="#E8C8AE"/>
      <!-- Pants hint -->
      <path d="M-10 45 L -12 75 M 10 45 L 12 75" stroke="#2C3E50" stroke-width="10" stroke-linecap="round"/>
    </g>
    
    <!-- Bride (right) -->
    <g transform="translate(18 0)">
      <!-- Hair (auburn updo with decorations) -->
      <ellipse cx="0" cy="-60" rx="12" ry="11" fill="#A0522D"/>
      <ellipse cx="2" cy="-65" rx="8" ry="6" fill="#8B4513"/>
      <!-- Hair flowers -->
      <circle cx="6" cy="-68" r="2" fill="#f5b8c4"/>
      <circle cx="10" cy="-64" r="1.5" fill="#ffffff"/>
      <circle cx="8" cy="-60" r="1.5" fill="#f5b8c4"/>
      <!-- Head -->
      <ellipse cx="0" cy="-52" rx="8" ry="9" fill="#F5DEB3"/>
      <!-- Neck -->
      <rect x="-3" y="-44" width="6" height="5" fill="#F5DEB3"/>
      <!-- Dress back (elegant with lace detail) -->
      <path d="M-14 -39 C -16 -20 -22 30 -35 75 L 35 75 C 22 30 16 -20 14 -39 C 8 -41 -8 -41 -14 -39 Z" fill="#E8E4DE"/>
      <!-- Dress back detail (low back) -->
      <path d="M-10 -39 C -8 -30 8 -30 10 -39" fill="#F5DEB3"/>
      <!-- Lace straps -->
      <path d="M-10 -39 C -12 -42 -10 -44 -8 -42" stroke="#d0ccc6" stroke-width="2" fill="none"/>
      <path d="M10 -39 C 12 -42 10 -44 8 -42" stroke="#d0ccc6" stroke-width="2" fill="none"/>
      <!-- Dress lace overlay pattern -->
      <path d="M-8 -20 Q 0 -15 8 -20 M-12 0 Q 0 8 12 0 M-18 25 Q 0 35 18 25" stroke="#d5d0ca" stroke-width="1" fill="none" opacity="0.6"/>
      <!-- Dress flow/train -->
      <ellipse cx="0" cy="75" rx="38" ry="8" fill="#E8E4DE"/>
      <!-- Arm -->
      <path d="M-14 -30 L -16 10" stroke="#F5DEB3" stroke-width="6" fill="none" stroke-linecap="round"/>
    </g>
  </g>

  <!-- More ground flowers -->
  <use href="#leaf" transform="translate(100 290) rotate(20) scale(1.2)"/>
  <use href="#leaf" transform="translate(115 295) rotate(-15) scale(1.1)"/>
  <use href="#wfl" transform="translate(108 288) scale(1.1)"/>
  <use href="#pfl" transform="translate(120 285) scale(0.9)"/>
  
  <use href="#leaf" transform="translate(300 290) rotate(-20) scale(1.2)"/>
  <use href="#leaf" transform="translate(285 295) rotate(15) scale(1.1)"/>
  <use href="#wfl" transform="translate(292 288) scale(1.1)"/>
  <use href="#pfl" transform="translate(280 285) scale(0.9)"/>

  <!-- Cream fade at the base: blends the scene seamlessly into the card body -->
  <rect x="0" y="255" width="400" height="65" fill="url(#fadeG)"/>
</svg>