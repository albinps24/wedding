<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 540" fill="none">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#f2f9f4"/>
      <stop offset="1" stop-color="#e6f2ea"/>
    </linearGradient>
    <g id="fSprig" stroke="#bfe0cb" stroke-width="1.6" fill="none" opacity="0.9">
      <path d="M0 0 C 20 -30 40 -70 46 -120"/>
      <ellipse cx="10" cy="-22" rx="7" ry="3.4" transform="rotate(-35 10 -22)" fill="#d6ecdd"/>
      <ellipse cx="18" cy="-44" rx="7" ry="3.4" transform="rotate(-40 18 -44)" fill="#d6ecdd"/>
      <ellipse cx="28" cy="-70" rx="7" ry="3.4" transform="rotate(-45 28 -70)" fill="#d6ecdd"/>
      <ellipse cx="38" cy="-96" rx="6" ry="3" transform="rotate(-50 38 -96)" fill="#d6ecdd"/>
      <circle cx="4" cy="-16" r="6" fill="#eef7f1" stroke="#bfe0cb"/>
      <circle cx="14" cy="-38" r="5" fill="#eef7f1" stroke="#bfe0cb"/>
      <circle cx="24" cy="-62" r="5" fill="#eef7f1" stroke="#bfe0cb"/>
    </g>
  </defs>

  <!-- Envelope body -->
  <rect x="0" y="0" width="400" height="540" rx="6" fill="url(#paper)"/>

  <!-- Embossed floral pattern, tiled softly across the paper -->
  <g opacity="0.55">
    <use href="#fSprig" transform="translate(70 500) scale(1.1)"/>
    <use href="#fSprig" transform="translate(150 520) scale(0.9) rotate(8)"/>
    <use href="#fSprig" transform="translate(250 520) scale(0.9) rotate(-8)"/>
    <use href="#fSprig" transform="translate(330 500) scale(1.1) rotate(-4)"/>
    <use href="#fSprig" transform="translate(50 320) scale(1.0) rotate(6)"/>
    <use href="#fSprig" transform="translate(350 320) scale(1.0) rotate(-6)"/>
    <use href="#fSprig" transform="translate(110 210) scale(0.85) rotate(30)"/>
    <use href="#fSprig" transform="translate(290 210) scale(0.85) rotate(-30)"/>
    <use href="#fSprig" transform="translate(200 150) scale(0.8)"/>
  </g>

  <!-- Center fold lines forming the pocket -->
  <path d="M0 40 L 200 250 L 400 40" stroke="#b6dcc3" stroke-width="1.5" fill="none" opacity="0.8"/>
  <path d="M0 40 L 200 250 L 400 40 L 400 0 L 0 0 Z" fill="#eaf5ee" opacity="0.5"/>
</svg>
